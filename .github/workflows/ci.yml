name: CI

on:
  push:
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # next/font downloads Google CSS at build time. A blip makes the loader
      # throw "Cannot read properties of null (reading '1')" with no code change.
      - name: Build
        run: |
          attempt=1
          until npm run build; do
            if [ "$attempt" -ge 3 ]; then
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "Build failed. Retrying ($attempt/3)..."
            sleep 8
          done
      - name: Install Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Browser tours
        working-directory: apps/web
        run: npx playwright test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest
